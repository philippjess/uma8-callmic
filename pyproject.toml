[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "uma8-callmic"
version = "0.1.0"
description = "Call-Mikrofon für das miniDSP UMA-8 unter PipeWire: Beamforming, Hallunterdrückung, DeepFilterNet"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy", "PySide6"]

[project.scripts]
uma8-callmic = "uma8_callmic.__main__:main"

[tool.setuptools.packages.find]
include = ["uma8_callmic*"]

[tool.setuptools.package-data]
"uma8_callmic.icons" = ["*.svg"]
"uma8_callmic.data" = ["*.in", "*.desktop"]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]
markers = [
    "integration: braucht laufendes PipeWire und installiertes Plugin",
    "hardware: braucht das angeschlossene UMA-8",
]
addopts = "-m 'not integration and not hardware'"
